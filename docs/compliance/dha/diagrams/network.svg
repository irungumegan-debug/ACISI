<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" font-family="Arial, Helvetica, sans-serif" style="background:#fff"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#14213d"/></marker><marker id="b" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#14213d"/></marker></defs><rect x="30" y="230" width="170" height="80" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="115" y="252" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Internet</text><text x="115" y="272" text-anchor="middle" font-size="12" fill="#5b6270">users, partners</text><rect x="240" y="40" width="730" height="490" rx="12" fill="#e7f4ea" stroke="#b8892d" stroke-width="1.5" stroke-dasharray="8 5"/><text x="252" y="60" font-size="12" font-weight="700" fill="#b8892d">HOSTAFRICA VPS (single host), NAIROBI</text><rect x="270" y="80" width="220" height="420" rx="12" fill="#ffffff" stroke="#b8892d" stroke-width="1.5" stroke-dasharray="8 5"/><text x="282" y="100" font-size="12" font-weight="700" fill="#b8892d">PUBLIC EDGE</text><rect x="285" y="120" width="190" height="110" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="380" y="142" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Firewall (ufw)</text><text x="380" y="162" text-anchor="middle" font-size="12" fill="#5b6270">allow 22, 80, 443 only</text><text x="380" y="178" text-anchor="middle" font-size="12" fill="#5b6270">deny all other inbound</text><rect x="285" y="260" width="190" height="90" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="380" y="282" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">fail2ban</text><text x="380" y="302" text-anchor="middle" font-size="12" fill="#5b6270">SSH: 5 failures / 10 min</text><text x="380" y="318" text-anchor="middle" font-size="12" fill="#5b6270">→ 1 hour ban</text><rect x="285" y="380" width="190" height="100" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="380" y="402" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Nginx :443</text><text x="380" y="422" text-anchor="middle" font-size="12" fill="#5b6270">TLS 1.2/1.3, HSTS</text><text x="380" y="438" text-anchor="middle" font-size="12" fill="#5b6270">HTTP :80 → HTTPS</text><text x="380" y="454" text-anchor="middle" font-size="12" fill="#5b6270">proxies to app on 127.0.0.1</text><rect x="520" y="80" width="430" height="420" rx="12" fill="#ffffff" stroke="#b8892d" stroke-width="1.5" stroke-dasharray="8 5"/><text x="532" y="100" font-size="12" font-weight="700" fill="#b8892d">INTERNAL (localhost only)</text><rect x="545" y="110" width="380" height="80" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="735" y="132" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">ACISI app :3000 (127.0.0.1)</text><text x="735" y="152" text-anchor="middle" font-size="12" fill="#5b6270">runs as user "acisi" under systemd</text><rect x="545" y="230" width="180" height="80" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="635" y="252" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">PostgreSQL :5432</text><text x="635" y="272" text-anchor="middle" font-size="12" fill="#5b6270">127.0.0.1 only</text><rect x="745" y="230" width="180" height="80" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="835" y="252" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Redis :6379</text><text x="835" y="272" text-anchor="middle" font-size="12" fill="#5b6270">127.0.0.1 only</text><rect x="545" y="350" width="380" height="120" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="735" y="372" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Administration</text><text x="735" y="392" text-anchor="middle" font-size="12" fill="#5b6270">SSH :22 key-only, no root, no passwords</text><text x="735" y="408" text-anchor="middle" font-size="12" fill="#5b6270">settings file root-only (/etc/acisi)</text><text x="735" y="424" text-anchor="middle" font-size="12" fill="#5b6270">emergency: provider VNC console</text><line x1="200" y1="270" x2="283" y2="175" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  /><text x="196.5" y="212.5" text-anchor="middle" font-size="11" fill="#5b6270" paint-order="stroke" stroke="#fff" stroke-width="4">HTTPS / SSH</text><line x1="380" y1="230" x2="380" y2="258" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  /><line x1="380" y1="350" x2="380" y2="378" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  /><line x1="475" y1="420" x2="543" y2="150" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  /><line x1="640" y1="190" x2="640" y2="228" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  /><line x1="830" y1="190" x2="830" y2="228" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  /></svg>