<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" font-family="Arial, Helvetica, sans-serif" style="background:#fff"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#14213d"/></marker><marker id="b" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#14213d"/></marker></defs><rect x="20" y="60" width="150" height="90" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="95" y="82" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Source</text><text x="95" y="102" text-anchor="middle" font-size="12" fill="#5b6270">GitHub repository</text><text x="95" y="118" text-anchor="middle" font-size="12" fill="#5b6270">branch per change</text><rect x="200" y="60" width="150" height="90" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="275" y="82" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Build & test</text><text x="275" y="102" text-anchor="middle" font-size="12" fill="#5b6270">tsc, ESLint, Jest</text><text x="275" y="118" text-anchor="middle" font-size="12" fill="#5b6270">~1,260 tests</text><rect x="380" y="60" width="150" height="90" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="455" y="82" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Review</text><text x="455" y="102" text-anchor="middle" font-size="12" fill="#5b6270">pull request</text><text x="455" y="118" text-anchor="middle" font-size="12" fill="#5b6270">owner approves</text><text x="455" y="134" text-anchor="middle" font-size="12" fill="#5b6270">and merges</text><rect x="560" y="60" width="150" height="90" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="635" y="82" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Backup</text><text x="635" y="102" text-anchor="middle" font-size="12" fill="#5b6270">encrypted DB +</text><text x="635" y="118" text-anchor="middle" font-size="12" fill="#5b6270">files backup</text><text x="635" y="134" text-anchor="middle" font-size="12" fill="#5b6270">before update</text><rect x="740" y="60" width="150" height="90" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="815" y="82" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Production</text><text x="815" y="102" text-anchor="middle" font-size="12" fill="#5b6270">git pull, npm ci,</text><text x="815" y="118" text-anchor="middle" font-size="12" fill="#5b6270">build, restart;</text><text x="815" y="134" text-anchor="middle" font-size="12" fill="#5b6270">migrations on start</text><rect x="870" y="190" width="120" height="80" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="930" y="212" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Verify</text><text x="930" y="232" text-anchor="middle" font-size="12" fill="#5b6270">/healthz,</text><text x="930" y="248" text-anchor="middle" font-size="12" fill="#5b6270">logs, checklist</text><line x1="170" y1="105" x2="198" y2="105" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  /><line x1="350" y1="105" x2="378" y2="105" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  /><line x1="530" y1="105" x2="558" y2="105" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  /><line x1="710" y1="105" x2="738" y2="105" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  /><line x1="860" y1="150" x2="910" y2="188" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  /><text x="20" y="215" font-size="12" fill="#5b6270">Manual, documented release (runbook "Updating the app"). No separate staging server yet; automated CI is a planned improvement.</text><text x="20" y="235" font-size="12" fill="#5b6270">Each database change ships with an undo script (prisma/rollback/). Development uses Docker Compose (PostgreSQL, Redis) on the developer's machine.</text></svg>