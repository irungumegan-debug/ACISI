<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" font-family="Arial, Helvetica, sans-serif" style="background:#fff"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#14213d"/></marker><marker id="b" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#14213d"/></marker></defs><rect x="20" y="20" width="960" height="90" rx="12" fill="#fff" stroke="#b8892d" stroke-width="1.5" stroke-dasharray="8 5"/><text x="32" y="40" font-size="12" font-weight="700" fill="#b8892d">USERS (browsers, phones)</text><rect x="40" y="45" width="180" height="55" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="130" y="67" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Patient portal</text><text x="130" y="87" text-anchor="middle" font-size="12" fill="#5b6270">React SPA at /</text><rect x="240" y="45" width="180" height="55" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="330" y="67" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Staff console</text><text x="330" y="87" text-anchor="middle" font-size="12" fill="#5b6270">React SPA at /console</text><rect x="440" y="45" width="180" height="55" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="530" y="67" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Owner site</text><text x="530" y="87" text-anchor="middle" font-size="12" fill="#5b6270">React SPA at /owner</text><rect x="640" y="45" width="160" height="55" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="720" y="67" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Phones</text><text x="720" y="87" text-anchor="middle" font-size="12" fill="#5b6270">SMS (USSD planned)</text><rect x="820" y="45" width="150" height="55" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="1.5" stroke-dasharray="6 4"/><text x="895" y="67" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Cloudflare</text><text x="895" y="87" text-anchor="middle" font-size="12" fill="#5b6270">DNS only, no proxy</text><rect x="20" y="140" width="960" height="480" rx="12" fill="#e7f4ea" stroke="#b8892d" stroke-width="1.5" stroke-dasharray="8 5"/><text x="32" y="160" font-size="12" font-weight="700" fill="#b8892d">HOSTAFRICA VPS, NAIROBI DATA CENTRE (Ubuntu 24.04)</text><rect x="330" y="175" width="340" height="70" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="500" y="197" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Nginx (TLS 1.2/1.3, HSTS, CSP)</text><text x="500" y="217" text-anchor="middle" font-size="12" fill="#5b6270">Let's Encrypt certificate, ports 80/443 only</text><rect x="250" y="290" width="500" height="120" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="500" y="312" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">ACISI application (Node.js, Express, TypeScript)</text><text x="500" y="332" text-anchor="middle" font-size="12" fill="#5b6270">REST APIs: /api/staff, /api/patients, /api/owner, /api/mpesa</text><text x="500" y="348" text-anchor="middle" font-size="12" fill="#5b6270">FHIR R4 interface: /fhir/r4</text><text x="500" y="364" text-anchor="middle" font-size="12" fill="#5b6270">Serves the three web apps; health check /healthz</text><text x="500" y="380" text-anchor="middle" font-size="12" fill="#5b6270">Background workers (BullMQ): SMS, payments, HIE, reports</text><rect x="60" y="470" width="230" height="110" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="175" y="492" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">PostgreSQL 18</text><text x="175" y="512" text-anchor="middle" font-size="12" fill="#5b6270">primary database, localhost only</text><text x="175" y="528" text-anchor="middle" font-size="12" fill="#5b6270">health fields AES-256-GCM</text><text x="175" y="544" text-anchor="middle" font-size="12" fill="#5b6270">append-only audit log</text><rect x="330" y="470" width="200" height="110" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="430" y="492" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Redis</text><text x="430" y="512" text-anchor="middle" font-size="12" fill="#5b6270">sessions, job queues</text><text x="430" y="528" text-anchor="middle" font-size="12" fill="#5b6270">localhost only, 64 MB</text><rect x="570" y="470" width="180" height="110" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="660" y="492" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Uploaded files</text><text x="660" y="512" text-anchor="middle" font-size="12" fill="#5b6270">/var/lib/acisi/uploads</text><text x="660" y="528" text-anchor="middle" font-size="12" fill="#5b6270">encrypted on disk</text><rect x="790" y="470" width="170" height="110" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="2" /><text x="875" y="492" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Nightly backups</text><text x="875" y="512" text-anchor="middle" font-size="12" fill="#5b6270">encrypted (age)</text><text x="875" y="528" text-anchor="middle" font-size="12" fill="#5b6270">14 days, on the</text><text x="875" y="544" text-anchor="middle" font-size="12" fill="#5b6270">same server today</text><line x1="130" y1="100" x2="420" y2="175" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  /><line x1="330" y1="100" x2="470" y2="175" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  /><line x1="530" y1="100" x2="520" y2="175" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  /><line x1="500" y1="245" x2="500" y2="288" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  /><line x1="330" y1="410" x2="200" y2="468" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  marker-start="url(#b)"/><line x1="430" y1="410" x2="430" y2="468" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  marker-start="url(#b)"/><line x1="600" y1="410" x2="650" y2="468" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  marker-start="url(#b)"/><line x1="700" y1="410" x2="860" y2="468" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  /><rect x="800" y="270" width="160" height="150" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="1.5" stroke-dasharray="6 4"/><text x="880" y="292" text-anchor="middle" font-weight="700" font-size="14" fill="#14213d">Outbound HTTPS</text><text x="880" y="312" text-anchor="middle" font-size="12" fill="#5b6270">Safaricom Daraja</text><text x="880" y="328" text-anchor="middle" font-size="12" fill="#5b6270">Africa's Talking</text><text x="880" y="344" text-anchor="middle" font-size="12" fill="#5b6270">DHA HIE (when</text><text x="880" y="360" text-anchor="middle" font-size="12" fill="#5b6270">connected)</text><line x1="750" y1="345" x2="798" y2="345" stroke="#14213d" stroke-width="1.6" marker-end="url(#a)"  /></svg>