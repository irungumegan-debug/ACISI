services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acisi
      POSTGRES_PASSWORD: acisi
      POSTGRES_DB: acisi
    ports:
      - "5432:5432"
    volumes:
      - acisi_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - acisi_redis_data:/data

volumes:
  acisi_postgres_data:
  acisi_redis_data:
