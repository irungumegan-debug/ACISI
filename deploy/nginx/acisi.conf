# Reference copy of /etc/nginx/sites-available/acisi on the server
# (enabled via a symlink in sites-enabled; Ubuntu's "default" site removed).
# Certificates: Let's Encrypt via certbot's Cloudflare DNS plugin, renewed by
# certbot.timer; /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh reloads Nginx.

# Anything that isn't acisi.co.ke (e.g. bots scanning the bare IP) gets no answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
}

# http:// -> https://acisi.co.ke
server {
    listen 80;
    listen [::]:80;
    server_name acisi.co.ke www.acisi.co.ke;
    return 301 https://acisi.co.ke$request_uri;
}

# https://www -> https://acisi.co.ke
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.acisi.co.ke;
    ssl_certificate     /etc/letsencrypt/live/acisi.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acisi.co.ke/privkey.pem;
    return 301 https://acisi.co.ke$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name acisi.co.ke;

    ssl_certificate     /etc/letsencrypt/live/acisi.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acisi.co.ke/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Live check-in queue (Server-Sent Events): pass each update through immediately.
    location = /api/staff/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 60s;
    }
}
